<div class="container">
    <h1 class="mt-3">Edit Order</h1>

    <ng-container *ngIf="order;else notFound">

        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="orderId">Order Id</label>
                    <input type="text" disabled id="orderId" class="form-control" name="orderId" value="{{order.id}}">
                </div>
            </div>

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="orderId">Status</label>
                    <input type="text" id="orderStatus" class="form-control" name="orderStatus" [(ngModel)]="order.status">
                </div>
            </div>
            <div class="mt-3 d-flex">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="submit" class="btn btn-danger ms-3" (click)="onDelete()">Delete</button>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            Order not found!
        </div>
    </ng-template>

</div>
