<div class="container">
    <h1 class="mt-3">Add Cosmetic</h1>

    <ng-container *ngIf="cosmetic">

        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2 mb-5">
                <div class="mt-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" class="form-control" [(ngModel)]="cosmetic.name">
                </div>

                <div class="mt-3">
                    <label for="urlHandle" class="form-label">Url Handle</label>
                    <input type="text" id="urlHandle" name="urlHandle" class="form-control" [(ngModel)]="cosmetic.urlHandle">
                </div>

                <div class="mt-3">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" id="price" name="price" class="form-control" [(ngModel)]="cosmetic.price">
                </div>

                <div class="mt-3">
                    <label for="description" class="form-label">description</label>

                    <div class="d-flex flex-row">
                        <div class="col-6 p-2">
                            <textarea id="description" name="description" class="from-control" style="height: 350px; width: 550px;max-height: 350px; " [(ngModel)]="cosmetic.description">
                            </textarea>
                        </div>

                        <!-- <div class="col-6 p-2" style="max-height: 350px; overflow-y: scroll;">
                            <markdown [data]="cosmetic.description"></markdown>
                        </div> -->
                    </div>
                </div>

                <div class="mt-3">
                    <label for="featuredImageUrl" class="form-label">Featured Image Url
                        <button type="button" class="btn btn-light" (click)="openImageSelector()">Select Image</button>
                    </label>

                    <ng-container *ngIf="cosmetic.featuredImageUrl !== ''"></ng-container>
                    <div>
                        <img [src]="cosmetic.featuredImageUrl" height="100" class="my-2">
                    </div>

                    <input type="text" id="featuredImageUrl" name="featuredImageUrl" class="form-control" [(ngModel)]="cosmetic.featuredImageUrl">
                </div>

                <div class="mt-3">
                    <label for="publishedDate" class="form-label">Published Date</label>
                    <input type="date" id="publishedDate" name="publishedDate" class="form-control" value="{{cosmetic.publishedDate}}" [ngModel]="cosmetic.publishedDate | date: 'yyy-MM-dd'" (ngModelChange)="cosmetic.publishedDate = $event">
                </div>

                <div class="mt-3">
                    <label for="brand" class="form-label">Brand</label>
                    <input type="text" id="brand" name="brand" class="form-control" [(ngModel)]="cosmetic.brand">
                </div>

                <div class="mt-3">
                    <label for="categories" class="form-label">Categories</label>
                    <ng-container *ngIf="categories$ | async as categories">
                        <select class="form-control" [(ngModel)]="selectedCategories" name="categories" id="categories" multiple>
                            <option *ngFor="let category of categories" [value]="category.id">{{category.name}}</option>
                        </select>
                    </ng-container>
                </div>

                <div class="mt-3 d-flex">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="submit" class="btn btn-danger ms-3" (click)="onDelete()">Delete</button>
                </div>
            </div>
        </form>
    </ng-container>
</div>

<div class="images-container-model" [ngClass]="{'d-block': isImageSelectorVisible, 'd-none': !isImageSelectorVisible}">
    <button type="button" class="btn btn-light" style="position: fixed; top: 10px; right: 10px" (click)="closeImageSelector()">X</button>
    <app-image-selector></app-image-selector>
</div>
