<div class="container">
    <h1 class="mt-3">Всі обговорення</h1>

    <div class="d-flex justify-content-end mt-3">
        <a [routerLink]="['/admin/blogposts/add']" class="btn btn-primary">Додати обговорення</a>
    </div>

    <ng-container *ngIf="blogPost$ | async as blogPosts">
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Назва</th>
                    <th>Короткий опис</th>
                    <th>Показати?</th>
                    <th>Категорії</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let blogPost of blogPosts">
                    <td>{{blogPost.title}}</td>
                    <td>{{blogPost.shortDescription}}</td>
                    <td>{{blogPost.isVisible}}
                        <td>
                            <span *ngFor="let category of blogPost.categories">
                            <span class="badge bg-secondary me-2">{{category.name}}</span>
                            </span>
                        </td>
                        <td>
                            <a class="btn btn-light" [routerLink]="['/admin/blogposts', blogPost.id]">Редагувати</a>
                        </td>
                </tr>
            </tbody>
        </table>

    </ng-container>

</div>
