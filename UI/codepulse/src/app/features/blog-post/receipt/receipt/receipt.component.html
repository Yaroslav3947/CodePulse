<ng-container *ngIf="cosmetics$ | async as cosmetics">

    <table class="body-wrap">
        <tbody>
            <tr>
                <td></td>
                <td class="container" width="600">
                    <div class="content">
                        <table class="main" width="100%" cellpadding="0" cellspacing="0">
                            <tbody>
                                <tr>
                                    <td class="content-wrap aligncenter">
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tbody>
                                                <tr>
                                                    <td class="content-block">
                                                        <h2>Thanks for using our app</h2>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td class="content-block">
                                                        <table class="invoice">
                                                            <tbody>
                                                                <tr>
                                                                    <span *ngIf="user">
                                                                        {{ user.email }}<br>
                                                                        Invoice #{{ invoiceNumber }}<br>
                                                                        {{ currentDate | date: 'MMMM dd yyyy' }}
                                                                    </span>
                                                                </tr>
                                                                <tr *ngFor="let cosmetic of cosmetics">
                                                                    <td>
                                                                        <table class="invoice-items" cellpadding="0" cellspacing="0">
                                                                            <tbody>
                                                                                <tr>
                                                                                    <td>{{cosmetic.name}} {{cosmetic.brand}}</td>
                                                                                    <td class="alignright">$ {{cosmetic.price}}</td>
                                                                                </tr>
                                                                            </tbody>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                                <tr class="bold-line">
                                                                    <td colspan="2"></td>
                                                                </tr>
                                                                <tr class="total">
                                                                    <td colspan="2" class="alignright total-text">Total: $ {{ calculateTotalPrice() }}</td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="footer">
                            <table width="100%">
                                <tbody>
                                    <tr>
                                        <td class="aligncenter content-block">Questions? Email <a href="mailto:">kogutyaroslav3947&#64;gmail.com</a></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </td>
                <td></td>
            </tr>
        </tbody>
    </table>
</ng-container>
