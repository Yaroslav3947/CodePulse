<div class="container">
    <h1 class="mt-3">Basket</h1>

    <ng-container *ngIf="products$ | async as products">
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th> </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let product of products">
                    <td>{{product.name}}</td>
                    <td>${{product.price}}</td>
                    <td>
                        <a class="btn btn-light" (click)="removeProduct(product)">Remove</a>
                    </td>
                </tr>
                <tr>
                    <td colspan="1"></td>
                    <td>Total:</td>
                    <td>${{ calculateTotalPrice() }}</td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-primary" [routerLink]="['/receipt']">Buy</button>
    </ng-container>
</div>
