<div class="container">
    <div class="mt-2">

        <div class="form-group mb-3">
            <label for="stockSearch">Search by Stock:</label>
            <input type="text" class="form-control" id="stockSearch" [(ngModel)]="searchStock" (input)="filterByStock()">
        </div>

        <div class="row mb-2">
            <div class="col-md-6" *ngFor="let category of categories; let i = index">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" [value]="category.id" id="{{category.id}}" [checked]="category.checked" (change)="onCheckboxChange(category)">
                    <label class="form-check-label" for="{{category.id}}">{{category.name}}</label>
                </div>
            </div>
        </div>

        <div class=" row align-items-strech ">

            <ng-container *ngIf="filteredProducts.length===0 ">
                <div class="alert alert-danger ">No products found.</div>
            </ng-container>

            <ng-container *ngIf="products$ | async as products ">
                <div class="col-12 col-md-4 mb-3 " *ngFor="let product of filteredProducts ">

                    <div class="card h-100 ">
                        <img [src]="product.featuredImageUrl " class="card img-top " [alt]="product.name ">
                        <div class="card-body d-flex flex-column ">
                            <h4 class="card-title ">
                                {{product.name}}
                            </h4>
                            <h5 class="card-title ">
                                {{product.stock}} in stock
                            </h5>
                            <h4 class="card-price ">
                                ${{product.price}}
                            </h4>
                            <p class="card-text ">
                                {{product.description}}
                            </p>

                            <span class="d-flex align-items-end " style="flex: 1 ">
                                <a [routerLink]="[ '/product', product.urlHandle] " class="btn btn-primary ">
                                    Read More
                                </a>
                            </span>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
