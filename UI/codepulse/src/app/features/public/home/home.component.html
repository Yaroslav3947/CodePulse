<div class="container">
    <div class="mt-5">

        <div class="form-group mb-3">
            <label for="brandSearch">Пошук за назвою:</label>
            <input type="text" class="form-control" id="nameSearch" [(ngModel)]="searchName" (input)="filterByName()">
        </div>

        <div class="row align-items-strech">

            <ng-container *ngIf="filteredBlogs.length===0 ">
                <div class="alert alert-danger ">Не знайдено обговорень</div>
            </ng-container>

            <ng-container *ngIf="blogs$ | async as blogs">
                <div class="col-12 col-md-4 mb-3" *ngFor="let blog of filteredBlogs">
                    <div class="card h-100">
                        <img [src]="blog.featuredImageUrl" class="card img-top" [alt]="blog.title">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">
                                {{blog.title}}
                            </h5>
                            <p class="card-text">
                                {{blog.shortDescription}}
                            </p>
                            <span class="d-flex align-items-end" style="flex: 1">
                                <a [routerLink]="['/blog', blog.urlHandle]" class="btn btn-primary">
                                    Читати більше
                                </a>
                            </span>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
