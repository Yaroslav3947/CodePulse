<div class="container">
    <div class="mt-5">
        <div class="col-12 col-md-6 col-lg-4 mx-auto">
            <h1>Login</h1>

            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

            <form #form="ngForm" (ngSubmit)="onFormSubmit()">
                <div class="mt-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" name="email" [(ngModel)]="model.email">
                </div>

                <div class="mt-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" [(ngModel)]="model.password">
                </div>

                <p class="small mb-5 pb-lg-2"><a class="text-black-50" href="forgotpass">Forgot password?</a></p>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
                <div class="mt-3">
                    <p class="mb-0">Don't have an account? <a href="/register" class="text-black-50 fw-bold">Register</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
