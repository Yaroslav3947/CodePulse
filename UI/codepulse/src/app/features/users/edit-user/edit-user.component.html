<div class="container">
    <h1 class="mt-3">Редагувати користувача</h1>

    <ng-container *ngIf="user;else notFound">

        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="userId">Id Користувача</label>
                    <input type="text" disabled id="userId" class="form-control" name="userId" value="{{user.id}}">
                </div>
            </div>

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="userEmail">Пошта користуавача</label>
                    <input type="text" id="UserEmail" class="form-control" name="userEmail" [(ngModel)]="user.email">
                </div>
            </div>

            <!-- <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="userName">Username</label>
                    <input type="text" id="Username" class="form-control" name="username" [(ngModel)]="user.userName">
                </div>
            </div> -->

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="userPhonenumber">Номер телефону користувача</label>
                    <input type="text" id="userPhonenumber" class="form-control" name="userPhonenumber" [(ngModel)]="user.phoneNumber">
                </div>
            </div>

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="userTwoFactorEnabled">Двох факторна верифікація</label>
                    <input type="text" disabled id="userTwoFactorEnabled" class="form-control" name="userTwoFactorEnabled" [(ngModel)]="user.twoFactorEnabled">
                </div>
            </div>


            <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>

            <div class="mt-3 d-flex">
                <button type="submit" class="btn btn-primary">Зберегти</button>
                <button type="submit" class="btn btn-danger ms-3" (click)="onDelete()">Видалити</button>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            Користувач не знайдено!
        </div>
    </ng-template>

</div>
