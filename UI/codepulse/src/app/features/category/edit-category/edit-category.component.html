<div class="container">
    <h1 class="mt-3">Редагувати Категорію</h1>

    <ng-container *ngIf="category;else notFound">

        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="categoryId">Id Категорії</label>
                    <input type="text" disabled id="categoryId" class="form-control" name="categoryId" value="{{category.id}}">
                </div>
            </div>

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="categoryId">Назва категорії</label>
                    <input type="text" id="categoryName" class="form-control" name="categoryName" [(ngModel)]="category.name">
                </div>
            </div>

            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="categoryUrlHandle">Url Handle Категорії</label>
                    <input type="text" id="categoryUrlHandle" class="form-control" name="categoryUrlHandle" [(ngModel)]="category.urlHandle">
                </div>
            </div>


            <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>

            <div class="mt-3 d-flex">
                <button type="submit" class="btn btn-primary">Зберегти</button>
                <button type="submit" class="btn btn-danger ms-3" (click)="onDelete()">Видалити</button>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            Категорії не знайдено!
        </div>
    </ng-template>

</div>
